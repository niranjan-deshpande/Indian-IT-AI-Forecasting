<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%TITLE%%</title>
<meta name="description" content="Working draft: how many workers does AI save in Indian IT services, and do clients buy more when the work gets cheaper?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
:root {
  color-scheme: light;
  --bg: #fbf8f3; --panel: #fffdf9; --ink: #2a2318; --ink-2: #5e5245; --ink-3: #8a7d6d;
  --rule: #e6ddd0; --rule-2: #cfc4b4;
  --accent: #235fa6; --mid: #2f8a57; --acn: #7a7268; --cat-a: #b0702a; --soft: #eef3f9;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Source Sans 3", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --toc-w: 250px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 16px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--serif);
  font-size: 17.5px; line-height: 1.6; font-optical-sizing: auto; }
.page { padding-left: 0; }
main { display: grid; grid-template-columns: 1fr min(700px, calc(100% - 32px)) 1fr; padding: 48px 0 72px; }
main > * { grid-column: 2; min-width: 0; }
main > .wide, main > details.more figure.wide { grid-column: 1 / -1; }
main > .wide { width: min(920px, calc(100% - 32px)); justify-self: center; }
p { margin: 0 0 1.05em; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
h1 { font-size: 2.0rem; line-height: 1.2; font-weight: 600; letter-spacing: -0.015em; margin: 0 0 14px; }
h2 { font-size: 1.36rem; line-height: 1.3; font-weight: 600; margin: 2.6em 0 0.7em; letter-spacing: -0.01em; }
h2 .num { color: var(--ink-3); font-weight: 400; margin-right: 0.35em; }
h3 { font-size: 1.08rem; font-weight: 600; margin: 1.9em 0 0.5em; }
ul, ol { padding-left: 1.3em; margin: 0 0 1.05em; } li { margin-bottom: 0.35em; }
header { padding-bottom: 22px; border-bottom: 1px solid var(--rule); margin-bottom: 8px; }
.crumbs { font-family: var(--sans); font-size: 14px; color: var(--ink-3); margin: 0 0 18px; }
.crumbs b { color: var(--ink-2); font-weight: 600; }
.byline { font-family: var(--sans); font-size: 15px; color: var(--ink-2); margin: 0 0 6px; }
.byline .tag { display: inline-block; border: 1px solid #c9a227; color: #7a6212; background: #fbf3d6; border-radius: 3px;
  padding: 0 6px; font-size: 12.5px; letter-spacing: 0.04em; text-transform: uppercase; margin-left: 4px; }
.thanks { font-family: var(--sans); font-size: 14px; color: var(--ink-2); margin: 0; }
code { font-size: 0.86em; background: #f1ebe1; padding: 1px 4px; border-radius: 3px; }

/* table of contents */
.toc { font-family: var(--sans); font-size: 14px; line-height: 1.35; }
.toc-head { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin-bottom: 10px; }
.toc ul { list-style: none; padding: 0; margin: 0; }
.toc > ul > li { margin: 0 0 10px; }
.toc > ul > li > a { font-weight: 600; color: var(--ink); }
.toc ul ul { margin: 4px 0 0 0; padding-left: 10px; border-left: 1px solid var(--rule); }
.toc ul ul li { margin: 3px 0; }
.toc a { color: var(--ink-2); text-decoration: none; display: block; padding: 1px 0; }
.toc a:hover { color: var(--accent); }
.toc a.active { color: var(--accent); }
.toc li.opt > a::after { content: " +"; color: var(--ink-3); font-size: 12px; }
@media (min-width: 1180px) {
  .page { padding-left: calc(var(--toc-w) + 24px); }
  .toc { position: fixed; top: 0; left: 0; width: var(--toc-w); height: 100vh; overflow-y: auto;
    padding: 48px 18px 32px 28px; border-right: 1px solid var(--rule); background: var(--bg); }
  .toc-mobile { display: none; }
}
@media (max-width: 1179px) {
  .page > .toc { display: none; }
  .toc-mobile { margin: 18px 0 0; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); padding: 8px 14px; }
  .toc-mobile > summary { font-family: var(--sans); font-weight: 600; font-size: 15px; cursor: pointer; }
  .toc-mobile .toc { padding: 8px 0 4px; } .toc-mobile .toc-head { display: none; }
}

/* answer box */
.answer { background: var(--soft); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; padding: 12px 18px 2px;
  margin: 0.4em 0 1.6em; }
.answer p { margin-bottom: 0.7em; }
.answer-tag { display: block; font-family: var(--sans); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--accent); font-weight: 600; margin-bottom: 4px; }

/* footnotes: hover (or tap) to read */
.fn { position: relative; }
.fn-ref { font-family: var(--sans); font-size: 0.68em; vertical-align: super; line-height: 0; text-decoration: none;
  color: var(--accent); padding: 0 2px; margin-left: 1px; font-weight: 600; cursor: pointer; }
.fn-ref::before { content: "["; } .fn-ref::after { content: "]"; }
.fn-pop { display: none; position: absolute; z-index: 30; left: 0; top: 1.5em; width: 360px; max-width: calc(100vw - 32px);
  background: #fffdf9; border: 1px solid var(--rule-2); border-radius: 6px; box-shadow: 0 6px 24px rgba(42,35,24,0.14);
  padding: 10px 13px; font-family: var(--sans); font-size: 14px; line-height: 1.45; color: var(--ink); font-weight: 400;
  font-style: normal; text-align: left; }
.fn-n { font-weight: 600; color: var(--accent); margin-right: 2px; }
.fn.show .fn-pop { display: block; }
@media (max-width: 700px) {
  .fn.show .fn-pop { position: fixed; left: 12px; right: 12px; bottom: 12px; top: auto; width: auto; max-width: none; }
}
ol.notes { font-family: var(--sans); font-size: 14px; line-height: 1.45; } ol.notes li { margin-bottom: 0.5em; }

/* collapsible detail sections */
details.more { margin: 2em 0; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); }
details.more > summary { cursor: pointer; padding: 12px 16px; list-style: none; display: flex; flex-wrap: wrap; gap: 4px 12px;
  align-items: baseline; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+"; font-family: var(--sans); color: var(--accent); font-weight: 600; width: 0.9em; }
details.more[open] > summary::before { content: "−"; }
.more-title { font-weight: 600; font-size: 1.08rem; }
.more-hint { font-family: var(--sans); font-size: 13px; color: var(--ink-3); }
details.more[open] .more-hint { display: none; }
.more-body { padding: 4px 18px 8px 34px; }
.more-body figure { margin-left: -16px; margin-right: -16px; }
details.app { border-bottom: 1px solid var(--rule); padding: 10px 0; }
details.app > summary { cursor: pointer; font-family: var(--sans); font-weight: 600; font-size: 15px; list-style: none; }
details.app > summary::-webkit-details-marker { display: none; }
details.app > summary::before { content: "+"; display: inline-block; width: 1.2em; color: var(--ink-3); }
details.app[open] > summary::before { content: "−"; }
details.app > div { padding: 8px 0 4px 1.2em; font-size: 15.5px; }
h2#appendix { margin-top: 3em; }

/* figures */
figure { margin: 2em 0 2.2em; }
.fig-panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px 8px; }
.fig-top { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.fig-title { font-family: var(--sans); font-weight: 600; font-size: 15px; color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-family: var(--sans); font-size: 13.5px; color: var(--ink); }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 6px; }
.legend i { display: inline-block; width: 20px; height: 0; border-top: 2.5px solid; vertical-align: middle; margin-right: 6px; }
.chart { width: 100%; }
figcaption { font-family: var(--sans); font-size: 14px; line-height: 1.5; color: var(--ink-2); margin: 10px 2px 0; max-width: 760px; }
figcaption b { color: var(--ink); font-weight: 600; }

/* tables */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 1.6em 0 1.9em; }
.table-cap { font-family: var(--sans); font-size: 14px; color: var(--ink-2); margin: 0 0 8px; }
.table-cap b { color: var(--ink); font-weight: 600; }
table { border-collapse: collapse; font-family: var(--sans); font-size: 14.5px; line-height: 1.4;
  font-variant-numeric: tabular-nums lining-nums; width: 100%; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--rule); text-align: right; vertical-align: top; }
th:first-child, td:first-child { padding-left: 0; text-align: left; }
th:last-child, td:last-child { padding-right: 0; }
thead th { font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--ink-3); vertical-align: bottom; }
tbody th { font-weight: 400; }
table.items td, table.items th { text-align: right; } table.items th:first-child, table.items td:first-child { text-align: left; }
.table-note { font-family: var(--sans); font-size: 13px; color: var(--ink-2); margin: 8px 0 0; }

.math { margin: 1.2em 0 1.4em; text-align: center; font-size: 1.05em; overflow-x: auto; overflow-y: hidden; }
.footer { font-family: var(--sans); font-size: 13px; color: var(--ink-3); margin-top: 2.5em; }

@media (max-width: 600px) {
  body { font-size: 17px; }
  main { padding-top: 28px; }
  h1 { font-size: 1.6rem; }
  .fig-panel { padding: 12px 10px 6px; }
  .more-body { padding: 4px 12px 8px 14px; }
  .more-body figure { margin-left: -6px; margin-right: -6px; }
}
@media print {
  body { background: #fff; font-size: 10.5pt; }
  .page { padding-left: 0; } .page > .toc, .toc-mobile { display: none; }
  .fn-pop { display: none !important; }
  .fig-panel { border: 0; padding: 0; }
  figure, .table-wrap { break-inside: avoid; }
}
</style>
</head>
<body>
<div class="page">
%%TOC%%
<main>
%%BODY%%
</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.0/plotly.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script>
const DATA = %%DATA%%;
const C = { accent: "#235fa6", acn: "#7a7268", a: "#b0702a", ink: "#2a2318", ink2: "#5e5245", ink3: "#8a7d6d",
  rule: "#e6ddd0", rule2: "#cfc4b4", mid: "#2f8a57", light: "#9fb8d6", grey: "#cfc4b4" };
const FONT = "'Source Sans 3', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif";
const CONFIG = { displayModeBar: false, responsive: true, scrollZoom: false };
const FIRM = { tcs: "#4d6f91", infosys: "#b8643f", hcltech: "#5a9370", wipro: "#8f68a6", techm: "#ae8a2c", ltim: "#c0607e" };

function baseLayout(extra) {
  return Object.assign({ font: { family: FONT, size: 12.5, color: C.ink2 }, paper_bgcolor: "rgba(0,0,0,0)",
    plot_bgcolor: "rgba(0,0,0,0)", showlegend: false, dragmode: false,
    hoverlabel: { bgcolor: "#fffdf9", bordercolor: C.rule2, font: { family: FONT, size: 13, color: C.ink } } }, extra);
}
function axis(extra) {
  return Object.assign({ showgrid: false, zeroline: false, fixedrange: true, showline: true, linecolor: C.rule2, linewidth: 1,
    ticks: "outside", ticklen: 4, tickcolor: C.rule2, tickfont: { family: FONT, size: 12, color: C.ink2 } }, extra);
}
function tint(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function W(el) { return el.getBoundingClientRect().width; }
function f1(v) { return v === null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(1); }
function zeroLine(xref, yref) { return { type: "line", xref: xref + " domain", yref, x0: 0, x1: 1, y0: 0, y1: 0, line: { color: C.rule2, width: 1 }, layer: "below" }; }
function vZero(yref) { return { type: "line", xref: "x", yref: yref + " domain", x0: 0, x1: 0, y0: 0, y1: 1, line: { color: C.ink3, width: 1 }, layer: "below" }; }
function ptitle(k, text) { return { text, xref: "x" + k + " domain", yref: "y" + k + " domain", x: 0, y: 1.03, xanchor: "left", yanchor: "bottom", showarrow: false, font: { family: FONT, size: 13.5, color: C.ink } }; }
function twoPanels(narrow, i, gap) {
  if (narrow) { const h = (1 - gap) / 2; return { x: [0, 1], y: i === 0 ? [1 - h, 1] : [0, h] }; }
  const w = (1 - gap) / 2; return { x: i === 0 ? [0, w] : [w + gap, 1], y: [0, 0.9] };
}
function draw(el, traces, layout) { Plotly.react(el, traces, baseLayout(layout), CONFIG); }
const FYT = (a, b) => { const v = [], t = []; for (let y = a; y <= b; y++) { v.push(y); t.push("FY" + String(y % 100).padStart(2, "0")); } return { tickvals: v, ticktext: t }; };

/* --- Fig 2: levels vs trend --- */
function figLevels() {
  const el = document.getElementById("chart-levels"), d = DATA.levels, narrow = W(el) < 640, gap = narrow ? 0.16 : 0.08;
  const traces = [], layout = { shapes: [], annotations: [] };
  [["headcount", "Headcount"], ["rev_cc", "Revenue (constant currency)"]].forEach(([m, title], i) => {
    const k = i ? "2" : "", dom = twoPanels(narrow, i, gap);
    const tr = (s, name, line) => ({ x: s.x, y: s.y, name, mode: "lines+markers", line, marker: { size: 5, color: line.color },
      xaxis: "x" + k, yaxis: "y" + k, hovertemplate: "%{x}: %{y:.1f}<extra>" + name + "</extra>" });
    traces.push(tr(d[m].top, "Top six", { color: C.accent, width: 2.75 }), tr(d[m].acn, "Accenture", { color: C.acn, width: 2, dash: "dash" }));
    const ft = FYT(2016, 2026);
    layout["xaxis" + k] = axis({ domain: dom.x, anchor: "y" + k, range: [2015.5, 2026.5], tickvals: [2016, 2018, 2020, 2022, 2024, 2026], ticktext: ["FY16", "FY18", "FY20", "FY22", "FY24", "FY26"] });
    layout["yaxis" + k] = axis({ domain: dom.y, anchor: "x" + k, range: [-24, 20], dtick: 10 });
    layout.shapes.push({ type: "line", xref: "x" + k + " domain", yref: "y" + k, x0: 0, x1: 1, y0: 0, y1: 0, line: { color: C.ink3, width: 1.5, dash: "dot" } },
      { type: "rect", xref: "x" + k, yref: "y" + k + " domain", x0: 2021.5, x1: 2023.5, y0: 0, y1: 1, fillcolor: C.a, opacity: 0.07, line: { width: 0 }, layer: "below" });
    layout.annotations.push(ptitle(k, title));
    const last = d[m].top.y[d[m].top.y.length - 1], fy23 = d[m].top.y[d[m].top.x.indexOf(2023)];
    layout.annotations.push({ x: 2026, y: last, xref: "x" + k, yref: "y" + k, text: f1(last), showarrow: false, xanchor: "left", xshift: 6, font: { size: 12, color: C.accent } },
      { x: 2023, y: fy23, xref: "x" + k, yref: "y" + k, text: f1(fy23), showarrow: false, yanchor: "bottom", yshift: 6, font: { size: 12, color: C.accent } });
    if (i === 0) layout.annotations.push({ x: 2022.5, y: 0, xref: "x", yref: "y domain", text: "boom", showarrow: false, yanchor: "bottom", font: { size: 11.5, color: C.a } });
  });
  draw(el, traces, Object.assign(layout, { height: narrow ? 560 : 320, hovermode: "x unified", margin: { l: 34, r: 30, t: 22, b: 30 } }));
  el.dataset.narrow = narrow;
}

/* --- Fig 3: PLFS sector employment --- */
function figSector() {
  const el = document.getElementById("chart-sector"), d = DATA.sector, narrow = W(el) < 640, gap = narrow ? 0.16 : 0.08;
  const traces = [], layout = { annotations: [] };
  [["all", "All workers in IT, millions"], ["young", "Graduates aged 21–30 in IT, millions"]].forEach(([m, title], i) => {
    const k = i ? "2" : "", dom = twoPanels(narrow, i, gap), s = d[m];
    traces.push({ x: s.x, y: s.y, type: "scatter", mode: "markers", marker: { size: 8, color: C.accent },
      error_y: { type: "data", symmetric: false, array: s.hi.map((h, j) => h - s.y[j]), arrayminus: s.lo.map((l, j) => s.y[j] - l), color: tint(C.accent, 0.45), thickness: 1.5, width: 0 },
      xaxis: "x" + k, yaxis: "y" + k, hovertemplate: "%{x}: %{y:.2f}m<extra></extra>" });
    layout["xaxis" + k] = axis({ domain: dom.x, anchor: "y" + k, tickangle: narrow ? -40 : -35, tickfont: { family: FONT, size: 11, color: C.ink2 } });
    layout["yaxis" + k] = axis({ domain: dom.y, anchor: "x" + k, rangemode: "tozero" });
    layout.annotations.push(ptitle(k, title));
  });
  draw(el, traces, Object.assign(layout, { height: narrow ? 600 : 330, hovermode: "closest", margin: { l: 34, r: 8, t: 22, b: 64 } }));
  el.dataset.narrow = narrow;
}

/* --- Fig 4: subcontracting --- */
function figSubcon() {
  const el = document.getElementById("chart-subcon"), d = DATA.subcon, narrow = W(el) < 640;
  const traces = d.firms.map(f => ({ x: d.x, y: f.y, text: f.text, name: f.name, mode: "lines+markers", line: { color: FIRM[f.key], width: 2 },
    marker: { size: 6, color: FIRM[f.key] }, hovertemplate: "%{text}<extra>" + f.name + "</extra>" }));
  const last = d.x[d.x.length - 1];
  const annotations = d.firms.map(f => ({ x: last, y: f.y[f.y.length - 1], xref: "x", yref: "y", text: f.name, xanchor: "left", xshift: 8,
    showarrow: false, font: { family: FONT, size: narrow ? 11 : 12.5, color: FIRM[f.key] } }));
  annotations.push({ x: 2023.5, y: 1, xref: "x", yref: "paper", yanchor: "bottom", text: "FY23 → FY24: fell at all six", showarrow: false, font: { size: 12, color: C.ink2 } });
  draw(el, traces, { height: 340, hovermode: "x unified", margin: { l: 34, r: narrow ? 92 : 110, t: 24, b: 30 },
    xaxis: axis({ range: [2019.7, 2026.3], tickvals: d.x, ticktext: d.labels }), yaxis: axis({ range: [3.5, 16.5], ticksuffix: "%", dtick: 2 }),
    shapes: [{ type: "rect", xref: "x", yref: "paper", x0: 2023, x1: 2024, y0: 0, y1: 1, fillcolor: C.accent, opacity: 0.06, line: { width: 0 }, layer: "below" }], annotations });
  el.dataset.narrow = narrow;
}

/* range rows (forest plot): rows = [{label, y, c, blo, bhi, slo, shi, color, nolabel}] */
function forest(el, rows, opts) {
  const narrow = W(el) < 640, traces = [], shapes = [], n = rows.length;
  rows.forEach((r, i) => { if (r.y === undefined) r.y = n - 1 - i; });
  rows.forEach(r => {
    const y = r.y, color = r.color || C.accent;
    if (r.slo !== undefined) shapes.push({ type: "line", x0: r.slo, x1: r.shi, y0: y, y1: y, line: { color: tint(color, 0.45), width: 1.5 } });
    if (r.blo !== undefined) shapes.push({ type: "line", x0: r.blo, x1: r.bhi, y0: y, y1: y, line: { color: tint(color, 0.75), width: 7 } });
    traces.push({ x: [r.c], y: [y], mode: "markers+text", type: "scatter", marker: { size: 11, color, line: { color: "#fff", width: 1.5 } },
      text: [f1(r.c)], textposition: "top center", textfont: { size: 12, color }, cliponaxis: false,
      hovertemplate: `<b>${r.hover || r.label}</b><br>central ${f1(r.c)}` + (r.blo !== undefined ? `<br>range ${f1(r.blo)} to ${f1(r.bhi)}` : "") +
        (r.slo !== undefined ? `<br>with sampling noise ${f1(r.slo)} to ${f1(r.shi)}` : "") + "<extra></extra>" });
  });
  const lab = rows.filter(r => !r.nolabel), ys = rows.map(r => r.y);
  shapes.push({ type: "line", x0: 0, x1: 0, yref: "paper", y0: 0, y1: 1, line: { color: C.ink3, width: 1 }, layer: "below" });
  (opts.seps || []).forEach(y => shapes.push({ type: "line", xref: "paper", x0: 0, x1: 1, y0: y, y1: y, line: { color: C.rule, width: 1 }, layer: "below" }));
  const lay = Object.assign({ height: opts.height || (60 + 46 * n), hovermode: "closest", shapes, annotations: [],
    margin: { l: narrow ? (opts.lmN || 130) : (opts.lm || 230), r: 16, t: opts.t || 10, b: 34 },
    xaxis: axis({ range: opts.range, dtick: opts.dtick || 1 }),
    yaxis: axis({ tickvals: lab.map(r => r.labelY !== undefined ? r.labelY : r.y), ticktext: lab.map(r => narrow && r.short ? r.short : r.label),
      range: [Math.min(...ys) - 0.7, Math.max(...ys) + 0.7], showline: false, ticks: "", tickfont: { family: FONT, size: narrow ? 11 : 12.5, color: C.ink } }) }, opts.extra || {});
  draw(el, traces, lay);
  el.dataset.narrow = narrow;
}

/* --- Fig 5: saving kept by baseline --- */
function figKept() {
  const el = document.getElementById("chart-kept"), k = DATA.kept, n = k.length, rows = [];
  k.forEach((w, i) => {
    const base = n - 1 - i;

/* footnotes: hover on desktop, tap anywhere */
const fns = document.querySelectorAll(".fn");
function place(fn) {
  const pop = fn.querySelector(".fn-pop"); pop.style.left = "0px";
  if (window.innerWidth <= 700) return;
  const r = pop.getBoundingClientRect(), over = r.right - (window.innerWidth - 16);
  if (over > 0) pop.style.left = (-over) + "px";
  const r2 = pop.getBoundingClientRect(); if (r2.left < 16) pop.style.left = (parseFloat(pop.style.left) + 16 - r2.left) + "px";
}
let hideT;
fns.forEach(fn => {
  fn.addEventListener("mouseenter", () => { if (window.matchMedia("(hover: hover)").matches) { clearTimeout(hideT); fns.forEach(f => f !== fn && f.classList.remove("show")); fn.classList.add("show"); place(fn); } });
  fn.addEventListener("mouseleave", () => { if (window.matchMedia("(hover: hover)").matches) hideT = setTimeout(() => fn.classList.remove("show"), 180); });
  fn.querySelector(".fn-ref").addEventListener("click", e => { e.preventDefault(); const on = !fn.classList.contains("show");
    fns.forEach(f => f.classList.remove("show")); if (on) { fn.classList.add("show"); place(fn); } });
});
document.addEventListener("click", e => { if (!e.target.closest(".fn")) fns.forEach(f => f.classList.remove("show")); });
document.addEventListener("keydown", e => { if (e.key === "Escape") fns.forEach(f => f.classList.remove("show")); });

/* table of contents: open collapsed sections when jumped to, highlight the current section */
document.querySelectorAll(".toc a").forEach(a => a.addEventListener("click", () => {
  const t = document.getElementById(a.dataset.target); if (t && t.tagName === "DETAILS") t.open = true;
  const m = a.closest(".toc-mobile"); if (m) m.open = false;
}));
const heads = [...document.querySelectorAll("main h2[id], main h3[id], main details.more[id]")];
function onScroll() {
  let cur = heads[0]; for (const h of heads) { if (h.getBoundingClientRect().top < 120) cur = h; }
  document.querySelectorAll(".toc a").forEach(a => a.classList.toggle("active", cur && a.dataset.target === cur.id));
}
window.addEventListener("scroll", () => requestAnimationFrame(onScroll), { passive: true }); onScroll();

if (window.katex) document.querySelectorAll(".math[data-tex]").forEach(el => katex.render(el.dataset.tex, el, { displayMode: true, throwOnError: false }));
</script>
</body>
</html>
